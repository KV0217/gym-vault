<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D6A" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="128" fill="#000000" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#262626" stroke-width="4" />

  <!-- Outer red accent ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#EF4444" stroke-width="3" opacity="0.3" stroke-dasharray="16 12" />

  <!-- Dumbbell Handle -->
  <rect x="136" y="240" width="240" height="32" rx="16" fill="#FFFFFF" />
  <rect x="190" y="234" width="132" height="44" rx="8" fill="#141414" stroke="#EF4444" stroke-width="3" />
  <!-- Knurling texture on handle -->
  <line x1="210" y1="238" x2="210" y2="274" stroke="#EF4444" stroke-width="2" opacity="0.6" />
  <line x1="230" y1="238" x2="230" y2="274" stroke="#EF4444" stroke-width="2" opacity="0.6" />
  <line x1="250" y1="238" x2="250" y2="274" stroke="#EF4444" stroke-width="2" opacity="0.6" />
  <line x1="270" y1="238" x2="270" y2="274" stroke="#EF4444" stroke-width="2" opacity="0.6" />
  <line x1="290" y1="238" x2="290" y2="274" stroke="#EF4444" stroke-width="2" opacity="0.6" />

  <!-- Left Inner Plate -->
  <rect x="132" y="176" width="34" height="160" rx="10" fill="url(#redGlow)" />
  <!-- Left Outer Plate -->
  <rect x="92" y="146" width="36" height="220" rx="12" fill="url(#redGlow)" />
  <!-- Left Collar -->
  <rect x="68" y="206" width="20" height="100" rx="6" fill="#FFFFFF" />

  <!-- Right Inner Plate -->
  <rect x="346" y="176" width="34" height="160" rx="10" fill="url(#redGlow)" />
  <!-- Right Outer Plate -->
  <rect x="384" y="146" width="36" height="220" rx="12" fill="url(#redGlow)" />
  <!-- Right Collar -->
  <rect x="424" y="206" width="20" height="100" rx="6" fill="#FFFFFF" />

  <!-- Crown / Star at Top -->
  <path d="M256 90 L268 126 L306 126 L275 148 L287 184 L256 162 L225 184 L237 148 L206 126 L244 126 Z" fill="#EF4444" filter="url(#glow)" />
</svg>
